[project]
name = "socratic-ai-tutor"
version = "0.1.0"
description = "AI Course Tutor using GraphRAG"
requires-python = ">=3.10,<3.14"
dependencies = [
    "nano-graphrag>=0.0.8",
    "networkx>=3.2",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "pypdf>=3.17.0",
    "python-pptx>=0.6.23",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.7.0",
    "notebook>=7.0.0",
    "matplotlib>=3.7.0",
    "nest-asyncio>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.12.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]
